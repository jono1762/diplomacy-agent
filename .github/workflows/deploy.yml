# Builds the replay site (site/build.sh) and publishes it to GitHub Pages.
# One-off setup: Settings -> Pages -> Source: GitHub Actions.
name: Deploy replay site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The web interface is taken from the diplomacy package; site/ui.patch targets this version
      - name: Install diplomacy
        run: pip install diplomacy==1.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build
        run: site/build.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.build/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
